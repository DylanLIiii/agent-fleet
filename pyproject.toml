[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-fleet"
version = "0.1.0"
description = "A calm, keyboard-first control room for your AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=8.2,<9", "typer>=0.15,<1"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
agent-fleet = "agent_fleet.cli:main"

[project.urls]
Repository = "https://github.com/DylanLIiii/agent-fleet"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "build>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
